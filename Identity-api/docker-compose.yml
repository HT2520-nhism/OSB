services:

  identity-api:
    build: .
    container_name: identity-api
    ports:
      - "3032:3032"
    env_file:
      - .env
    depends_on:
      - identity-db
    networks:
      - app-network

  identity-db:
    image: postgres:16
    container_name: identity-db
    restart: always
    environment:
      POSTGRES_DB: identity-api
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
    ports:
      - "5432:5432"
    volumes:
      - identity-data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  identity-data:

networks:
  app-network:
    name: app-network